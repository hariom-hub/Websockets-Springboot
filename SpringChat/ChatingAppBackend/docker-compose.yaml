
services:
  mongodb:
    image: mongo:7
    container_name: chat-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - chat-net

  backend:
    ports:
      - "8081:8080"
    environment:
      SPRING_DATA_MONGODB_URI : mongodb://localhost:27017/ChatApp
    depends_on:
      - mongodb
    networks:
      - chat-net

  frontend:
    image: node:20-alpine
    container_name: chat-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command:
      - sh -c "npm install && npm start"
    ports:
      - "5174:5173"
    depends_on:
      - backend
    networks:
      - chat-net

volumes:
  mongo-data:

networks:
  chat-net:


